            position: relative;

            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50%;

            border-top: 2px solid var(--highlight);

        // ==================== THREE.JS 3D ABSTRACT DATA NETWORK ====================
        class ThreeDataNetwork {
            constructor() {
                this.container = document.getElementById('three-container');
                if (!this.container) return;
                
                // Scene
                this.scene = new THREE.Scene();
                
                // Camera
                this.camera = new THREE.PerspectiveCamera(
                    75,
                    this.container.clientWidth / this.container.clientHeight,
                    0.1,
                    1000
                );
                this.camera.position.z = 8;
                
                // Renderer
                this.renderer = new THREE.WebGLRenderer({
                    alpha: true,
                    antialias: true
                });
                this.renderer.setSize(
                    this.container.clientWidth,
                    this.container.clientHeight
                );
                this.renderer.setClearColor(0x000000, 0);
                this.container.appendChild(this.renderer.domElement);
                
                // Create data network
                this.createNetwork();
                
                // Animation loop
                this.animate();
                
                // Handle resize
                window.addEventListener('resize', () => this.onResize());
            }
            
            createNetwork() {
                // Create central data hub (sphere)
                const hubGeometry = new THREE.SphereGeometry(0.5, 16, 16);
                const hubMaterial = new THREE.MeshBasicMaterial({
                    color: 0x3b82f6,
                    wireframe: true,
                    transparent: true,
                    opacity: 0.3
                });
                
                this.hub = new THREE.Mesh(hubGeometry, hubMaterial);
                this.scene.add(this.hub);
                
                // Create data nodes
                this.nodes = [];
                const nodeCount = 8;
                
                for (let i = 0; i < nodeCount; i++) {
                    // Create node
                    const nodeGeometry = new THREE.SphereGeometry(0.1, 8, 8);
                    const nodeMaterial = new THREE.MeshBasicMaterial({
                        color: 0x10b981,
                        transparent: true,
                        opacity: 0.2
                    });
                    
                    const node = new THREE.Mesh(nodeGeometry, nodeMaterial);
                    
                    // Position in a sphere around hub
                    const radius = 2 + Math.random() * 2;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.random() * Math.PI;
                    
                    node.position.x = radius * Math.sin(phi) * Math.cos(theta);
                    node.position.y = radius * Math.sin(phi) * Math.sin(theta);
                    node.position.z = radius * Math.cos(phi);
                    
                    node.userData = {
                        originalX: node.position.x,
                        originalY: node.position.y,
                        originalZ: node.position.z,
                        speed: 0.3 + Math.random() * 0.3
                    };
                    
                    this.nodes.push(node);
                    this.scene.add(node);
                }
            }
            
            animate() {
                requestAnimationFrame(() => this.animate());
                
                const time = Date.now() * 0.001;
                
                // Rotate hub
                if (this.hub) {
                    this.hub.rotation.x += 0.003;
                    this.hub.rotation.y += 0.003;
                }
                
                // Animate nodes
                this.nodes.forEach((node, i) => {
                    const data = node.userData;
                    
                    // Subtle floating motion
                    node.position.x = data.originalX + Math.sin(time * data.speed) * 0.2;
                    node.position.y = data.originalY + Math.cos(time * data.speed * 1.3) * 0.2;
                    node.position.z = data.originalZ + Math.sin(time * data.speed * 0.7) * 0.2;
                });
                
                // Render
                this.renderer.render(this.scene, this.camera);
            }
            
            onResize() {
                this.camera.aspect = this.container.clientWidth / this.container.clientHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(
                    this.container.clientWidth,
                    this.container.clientHeight
                );
            }
        }

            methods: {
                toggleMenu() {
                    this.menuOpen = !this.menuOpen;
                },
                scrollTo(sectionId) {
                    this.activeSection = sectionId;
                    const element = document.getElementById(sectionId);
                    if (element) {
                        window.scrollTo({
                            top: element.offsetTop - 80,
                            behavior: 'smooth'
                        });
                    }
                },
                submitContact() {
                    this.formSubmitted = true;
                    
                    this.contact = {
                        name: '',
                        email: '',
                        subject: '',
                        message: ''
                    };
                    
                    setTimeout(() => {
                        this.formSubmitted = false;
                    }, 5000);
                },
                handleScroll() {
                    this.showTopButton = window.scrollY > 500;
                    
                    const sections = ['home', 'about', 'experience', 'certifications', 'contact'];
                    for (const section of sections) {
                        const element = document.getElementById(section);
                        if (element) {
                            const rect = element.getBoundingClientRect();
                            if (rect.top <= 150 && rect.bottom >= 150) {
                                this.activeSection = section;
                                break;
                            }
                        }
                    }
                    
                    this.checkSectionVisibility();
                    this.animateSkillBars();
                },
                checkSectionVisibility() {
                    const sections = [
                        { id: 'home', ref: 'heroVisible' },
                        { id: 'about', ref: 'aboutVisible' },
                        { id: 'experience', ref: 'experienceVisible' },
                        { id: 'certifications', ref: 'certificationsVisible' },
                        { id: 'contact', ref: 'contactVisible' }
                    ];
                    
                    sections.forEach(section => {
                        const element = document.getElementById(section.id);
                        if (element) {
                            const rect = element.getBoundingClientRect();
                            if (rect.top < window.innerHeight * 0.75 && rect.bottom > 0) {
                                this[section.ref] = true;
                            }
                        }
                    });
                },
                animateSkillBars() {
                    const skills = document.querySelectorAll('.skill-progress');
                    skills.forEach(skill => {
                        const rect = skill.getBoundingClientRect();
                        if (rect.top < window.innerHeight && rect.bottom > 0 && skill.style.width === '0px') {
                            const width = skill.getAttribute('data-width');
                            skill.style.width = width + '%';
                        }
                    });
                }
            },
            mounted() {
                setTimeout(() => {
                    this.loading = false;
                    this.heroVisible = true;
                    
                    new BackgroundNameAnimation();
                    new ThreeDataNetwork();
                    new ParticleSystem();
                }, 1500);
                
                window.addEventListener('scroll', this.handleScroll);
                this.handleScroll();
            },
            beforeDestroy() {
                window.removeEventListener('scroll', this.handleScroll);
            }
        });

        new Vue({
            el: '#app'
        });
    </script>
